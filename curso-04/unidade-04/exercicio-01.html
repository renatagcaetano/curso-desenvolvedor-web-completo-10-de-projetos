<!doctype html>
<html>
    <head>
        <meta charset="UTF-8">

        <title>Curso jQuery Fundamental</title>
        
        <style>
			ul {
                margin:0;
                padding:0;
                list-style:none;
            }

			li {
                display:inline-block;
                margin-right:10px;
            }
		</style>
        
        <script src="jquery-3.2.1.min.js"></script>

        <script>
			$(function(e) {
                $('<li><img src="imagem/foto-04.jpg"></li>').insertAfter('li:last-child');
                // $('<li><img src="imagem/foto-04.jpg"></li>').insertBefore('li:last-child');
                // $('<li><img src="imagem/foto-04.jpg"></li>').insertAfter('li:first-child');
                $('<li><img src="imagem/foto-05.jpg"></li>').insertAfter('li:nth(2)');
			});
		</script>
    </head>

    <body>
		<ul>
        	<li><img src="imagem/foto-01.jpg"></li>
            <li><img src="imagem/foto-02.jpg"></li>
            <li><img src="imagem/foto-03.jpg"></li>
        </ul>
    </body>
</html>
