<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Curso de CSS - Menu Vertical</title>
		<style>
            body {
                font-family: "Trebuchet MS", Arial, Helvetica, sans-serif;
                font-size: 13px;
            }

            nav ul {
                margin: 0;
                padding: 0;
                text-align: center;
            }

            nav ul li {
                display: inline;
                list-style-type: none;
            }

            nav ul li a {
                display: inline-block;
                width: 120px;
                margin-right: -3px;
                padding: 10px 30px;
                background-color: cornflowerblue;
                text-decoration: none;
                color: #fff;
            }

            nav ul li a:hover {
                background-color: darkslateblue;
            }
        </style>

    </head>

    <body>
        <nav>
            <ul>
                <li><a href="brasil.html">Brasil</a></li>
                <li><a href="portugal.html">Portugal</a></li>
                <li><a href="angola.html">Angola</a></li>
                <li><a href="mocambique.html">Moçambique</a></li>
                <li><a href="caboverde.html">Cabo Verde</a></li>
            </ul>
        </nav>
    </body>
</html>
