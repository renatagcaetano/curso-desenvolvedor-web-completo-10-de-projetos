<html>
    <head>
        <title>Aulas de Javascript</title>

        <script>
            var salada = ['Uva','Banana','Pera'];

            //Adiciona elementos no final do Array
            salada.push('Mamão');

            //Adiciona elementos no início do Array
            salada.unshift('Laranja');

            console.log(salada);
            console.log('Total de elementos: ' + salada.length);

            //Exclui o último elemento do Array
            salada.pop();

            //Exclui o primeiro elemento do Array
            salada.shift();

            console.log(salada);
            console.log('Total de elementos: ' + salada.length);
        </script>
    </head>

    <body>
        
    </body>
</html>
