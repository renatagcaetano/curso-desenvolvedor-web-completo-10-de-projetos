<html>
    <head>
        <title>Aulas de Javascript</title>

        <script>
            function converterTemperatura(celsius) {
                var fah = (celsius * 1.8) + 32;

                return fah;
            }

            var fahrenheit = converterTemperatura(30);

            console.log("Temperatura: " + fahrenheit);
        </script>
    </head>
