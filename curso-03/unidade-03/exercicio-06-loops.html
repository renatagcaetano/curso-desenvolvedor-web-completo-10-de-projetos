<html>
    <head>
        <title>Aulas de Javascript</title>

        <script>
            var i = 1;

            console.log("While:");
            while (i < 10) {
                console.log("Passo: " + i);

                i++;
            }

            i = 1;
            
            console.log("Do While:");
            do {
                console.log("Passo: " + i);

                i++;
            } while (i < 10);

            i = 10;

            console.log("Do While com i = 10:");
            do {
                console.log("Passo: " + i);

                i++;
            } while (i < 10);

            console.log("For:");
            for (var i = 0; i < 10; i++) {
                console.log("Passo: " + i);
            }
        </script>
    </head>

    <body>
        
    </body>
</html>
