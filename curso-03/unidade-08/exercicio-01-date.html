<html>
    <head>
        <title>Aulas de Javascript</title>
        <script>
            var agora = new Date();
            var aniversario = new Date(2000, 8, 20);

            var meses = [
                'Janeiro', 'Fevereiro', 'Março', 'Abril',
                'Maio', 'Junho', 'Julho', 'Agosto',
                'Setembro', 'Outubro', 'Novembro', 'Dezembro'
            ];

            console.log('Data atual: ' + agora.getDate() + ' de ' + meses[agora.getMonth()] + ' de ' + 
                        agora.getFullYear());
            console.log('Dia da semana do aniverário: ' + aniversario.getDay());
        </script>
    </head>
    <body>
        
    </body>
</html>
