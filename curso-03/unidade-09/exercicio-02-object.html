<html>
    <head>
        <title>Aulas de Javascript</title>

        <script>
            function retornarInfo() {
                return [
                    'Produto: ' + this.nome,
                    'Preço: ' + this.preco,
                    'Cor: ' + this.cor
                ].join('\n');
            }

            var produto = new Object();

            produto.nome = 'Caneta';
            produto.preco = 1.99;
            produto.cor = 'Azul';

            produto.info = retornarInfo;

            console.log(produto.info());
        </script>
    </head>

    <body>
        
    </body>
</html>
